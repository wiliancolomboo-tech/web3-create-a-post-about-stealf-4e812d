version: "3.8"

services:
  stealf-scanner-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stealf-scanner-core
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - RECIPIENT_SPEND_PRIV_HEX=${RECIPIENT_SPEND_PRIV_HEX}
      - RECIPIENT_VIEW_PRIV_HEX=${RECIPIENT_VIEW_PRIV_HEX}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_RECIPIENT_EMAIL=${RESEND_RECIPIENT_EMAIL}
      - SCAN_POLL_INTERVAL_MS=1500
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3