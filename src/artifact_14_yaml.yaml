version: '3.8'

services:
  stealf-scanner-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - STEALF_PROGRAM_ID=Stea1f1111111111111111111111111111111111111
      - VIEW_PRIVKEY=${INSTITUTIONAL_VIEW_KEY}
      - SPEND_PRIVKEY=${INSTITUTIONAL_SPEND_KEY}
      - WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
    command: ["scan", "--webhook", "${WEBHOOK_URL}"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"