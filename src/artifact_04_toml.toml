[package]
name = "stealf-core"
version = "0.1.0"
description = "Stealf Protocol - High Performance Stealth Address Announcement Registry for Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "stealf_core"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
solana-program = "1.18.26"